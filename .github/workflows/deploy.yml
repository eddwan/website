# Publica em https://eddwan.com no Cloudflare Workers a cada push na main (o merge da develop na
# main gera esse push), de 3 em 3 horas (vídeos novos do canal) e à mão em Actions.
# Precisa do secret CLOUDFLARE_API_TOKEN (modelo "Edit Cloudflare Workers"; ver README).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Vídeos novos do canal entram pelo feed do YouTube no build: refaz o site de 3 em 3 horas
  # (00h15, 03h15, ... em UTC; 21h15, 00h15 etc. em Brasília, logo depois dos horários de publicação)
  schedule:
    - cron: '15 */3 * * *'

# Um deploy por vez; se chegar outro push, o anterior termina antes
concurrency:
  group: deploy-producao
  cancel-in-progress: false

# O deploy agendado pode criar posts dos vídeos novos e fazer commit deles
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: producao
      url: https://eddwan.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # Com a main protegida, só a chave de deploy DEPLOY_KEY_POSTS (liberada na regra da main)
      # consegue enviar os posts automáticos direto para ela. Sem o secret, usa o token padrão.
      - uses: actions/checkout@v5
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY_POSTS }}
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Vídeo novo público no canal sem post: cria o post pelo feed do YouTube (título, descrição e shorts),
      # faz o commit na main (e na develop, quando ela não tem trabalho próprio) e segue para o deploy.
      # Só no agendado e no manual; no push (merge) não mexe no repositório.
      - name: Posts dos vídeos novos do canal
        if: github.event_name != 'push'
        run: |
          npm run -s post-do-video -- --novos || { echo "::warning::Não deu para ler o feed do YouTube; deploy segue sem posts novos."; exit 0; }
          if [ -n "$(git status --porcelain src/content/blog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/content/blog
            git commit -m "Posts automáticos dos vídeos novos do canal" -m "$(git diff --cached --name-only | sed 's#^src/content/blog/#- #')"
            git push origin HEAD:main
            git push origin HEAD:develop || echo "::notice::A develop tem commits próprios; os posts chegam a ela no próximo merge da main."
            echo "::notice::Posts novos: $(git diff --name-only HEAD~1 | tr '\n' ' ')"
          fi
      - name: Build e deploy do site
        run: npm run cf:deploy
      - name: Deploy do redirecionamento do www
        run: npm run cf:deploy-www
      - name: Conferir o site no ar
        # A proteção contra robôs da Cloudflare pode responder 403 aos IPs do GitHub. Nesse caso
        # fica um aviso (o deploy já deu certo); qualquer outro código diferente do esperado falha.
        run: |
          confere() {
            local url=$1 esperado=$2 obtido
            obtido=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            obtido=${obtido% }
            echo "$url -> $obtido"
            if [ "$obtido" = "$esperado" ]; then return 0; fi
            if [ "${obtido%% *}" = 403 ]; then
              echo "::warning::$url respondeu 403 ao GitHub (proteção contra robôs da Cloudflare); confira no navegador."
              return 0
            fi
            echo "::error::$url: esperado '$esperado', veio '$obtido'"
            return 1
          }
          falhou=0
          for caminho in / /sobre /portfolio /videos /blog /rss.xml /sitemap-index.xml; do
            confere "https://eddwan.com$caminho" 200 || falhou=1
          done
          confere https://www.eddwan.com/sobre "301 https://eddwan.com/sobre" || falhou=1
          exit $falhou
