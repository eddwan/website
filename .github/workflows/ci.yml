# Confere o build em todo push na develop e em todo pull request para a develop ou a main.
# Não publica nada nem usa segredos (PRs de fork rodam com permissão só de leitura):
# o deploy só acontece no merge na main (deploy.yml). As migrações do D1 rodam num banco local
# descartável, sem conta da Cloudflare: um PR com SQL quebrado falha aqui.
name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Migrações do banco D1 (banco local, sem conta)
        run: npx wrangler d1 migrations apply eddwan-votos --local
      - name: Build e simulação do deploy (site e redirecionamento do www)
        run: |
          npm run cf:check
          npx wrangler deploy -c cloudflare/www-redirect/wrangler.jsonc --dry-run
